version: "3.8"

services:
  superset:
    build: .
    image: superset-duckdb
    container_name: superset
    ports:
      - "8088:8088"
    environment:
      - SUPERSET_SECRET_KEY=mysecretkey
    command: >
      /bin/sh -c "
      superset db upgrade &&
      superset fab create-admin
      --username admin
      --firstname Admin
      --lastname User
      --email admin@example.com
      --password admin &&
      superset init &&
      superset run -h 0.0.0.0 -p 8088"